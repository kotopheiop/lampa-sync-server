services:
  lampa-sync:
    build: .
    image: lampa-sync-server:latest
    container_name: lampa-sync-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      SYNC_PASSWORD: "${SYNC_PASSWORD:?set SYNC_PASSWORD in .env}"
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
