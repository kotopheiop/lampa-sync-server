services:
  lampa-sync:
    build: .
    image: lampa-sync-server:latest
    container_name: lampa-sync-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      SYNC_PASSWORD: "${SYNC_PASSWORD:?set SYNC_PASSWORD in .env}"
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
